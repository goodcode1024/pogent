name: Build unsigned IPA

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ipa-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: iOS unsigned .ipa
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show runner image
        run: |
          sw_vers
          uname -m
          echo "--- Xcode 安装情况 ---"
          ls -d /Applications/Xcode*.app 2>/dev/null || echo "no Xcode"

      - name: Select newest Xcode (prefer iOS 27 SDK)
        id: pick-xcode
        run: |
          set -euo pipefail
          BEST=""; BEST_V=0; WANT27=""
          for app in /Applications/Xcode*.app; do
            [ -d "$app" ] || continue
            sdkdir="$app/Contents/Developer/Platforms/iPhoneOS.platform/Developer/SDKs"
            [ -d "$sdkdir" ] || continue
            v=$(ls "$sdkdir" | sed -n 's/^iPhoneOS\([0-9][0-9]*\)\.sdk$/\1/p' | sort -n | tail -1)
            v=${v:-0}
            echo "$app -> iOS SDK $v"
            if [ "$v" -ge 27 ] && [ -z "$WANT27" ]; then WANT27="$app"; fi
            if [ "$v" -gt "$BEST_V" ]; then BEST_V=$v; BEST=$app; fi
          done
          if [ -n "$WANT27" ]; then
            PICK="$WANT27"
            echo "::notice::找到 iOS 27 SDK，使用 $PICK"
          else
            PICK="$BEST"
            echo "::warning::runner 上没有 iOS 27 SDK（最高 iOS $BEST_V），将临时下调部署目标以便产出 IPA"
          fi
          echo "DEVELOPER_DIR=$PICK/Contents/Developer" >> "$GITHUB_ENV"
          echo "sdk_major=$BEST_V" >> "$GITHUB_OUTPUT"

      - name: Verify toolchain
        run: |
          xcodebuild -version
          xcodebuild -showsdks | sed -n '1,40p'
          swift --version

      - name: Install XcodeGen
        run: |
          if command -v xcodegen >/dev/null 2>&1; then
            xcodegen --version
          else
            brew install xcodegen
          fi

      - name: Generate Xcode project
        run: |
          xcodegen generate --spec project.yml
          ls -la Pogent.xcodeproj

      - name: Build (no code signing)
        id: build
        run: |
          set -o pipefail
          SDK_MAJOR="${{ steps.pick-xcode.outputs.sdk_major }}"
          OVERRIDE=""
          # 没有 iOS 27 SDK 时，把部署目标压到当前 SDK 大版本，避免 "SDK does not support" 直接失败
          if [ "$SDK_MAJOR" -lt 27 ]; then
            OVERRIDE="IPHONEOS_DEPLOYMENT_TARGET=$SDK_MAJOR.0"
            echo "::warning::降级构建：$OVERRIDE"
          fi
          set -x
          xcodebuild \
            -project Pogent.xcodeproj \
            -scheme Pogent \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_STYLE=Manual \
            PROVISIONING_PROFILE_SPECIFIER="" \
            DEVELOPMENT_TEAM="" \
            ENABLE_BITCODE=NO \
            DEBUG_INFORMATION_FORMAT=dwarf \
            $OVERRIDE \
            build 2>&1 | tee build.log | tail -n 250

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -1)
          if [ -z "$APP" ]; then echo "::error::没找到 .app 产物"; exit 1; fi
          echo "APP=$APP"
          rm -rf Payload Pogent-unsigned.ipa
          mkdir -p Payload
          cp -R "$APP" Payload/
          # 未签名包：清掉可能残留的签名描述文件，签名由用户后续自行完成
          rm -rf Payload/*.app/_CodeSignature Payload/*.app/embedded.mobileprovision || true
          zip -qry Pogent-unsigned.ipa Payload
          ls -lh Pogent-unsigned.ipa
          unzip -l Pogent-unsigned.ipa | head -20
          echo "### ✅ 未签名 IPA 已生成" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| 项 | 值 |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| 文件 | \`Pogent-unsigned.ipa\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| 大小 | $(du -h Pogent-unsigned.ipa | cut -f1) |" >> "$GITHUB_STEP_SUMMARY"
          echo "| iOS SDK | $(xcodebuild -showsdks | grep -m1 iphoneos || true) |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Xcode | $(xcodebuild -version | tr '\n' ' ') |" >> "$GITHUB_STEP_SUMMARY"
          echo "| 签名 | 无（需自行用证书/AltStore/Sideloadly 签名） |" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: pogent-unsigned-ipa
          path: Pogent-unsigned.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            build.log
            build/Logs/Build/*.xcactivitylog
          if-no-files-found: warn
          retention-days: 7

  release:
    name: Attach IPA to release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: pogent-unsigned-ipa

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: Pogent-unsigned.ipa
          generate_release_notes: true
