name: Build unsigned IPA

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ipa-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: iOS unsigned .ipa
    # macos-26 在免费/个人账号上常常分不到机器（会一直 queued），macos-latest 有稳定容量
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show runner image
        run: |
          sw_vers
          uname -m
          xcode-select -p

      - name: Select newest Xcode (prefer iOS 27 SDK)
        id: pick-xcode
        shell: bash
        run: |
          set -euo pipefail
          tmp=$(mktemp)
          for app in /Applications/Xcode*.app; do
            dev="$app/Contents/Developer"
            [ -d "$dev/Platforms/iPhoneOS.platform" ] || continue
            ver=$(DEVELOPER_DIR="$dev" xcrun --sdk iphoneos --show-sdk-version 2>/dev/null || echo "0")
            [ -n "$ver" ] && [ "$ver" != "0" ] || continue
            echo "$ver|$app" >> "$tmp"
            echo "$app -> iOS SDK $ver"
          done

          if [ ! -s "$tmp" ]; then
            echo "::error::没有找到任何带 iPhoneOS SDK 的 Xcode"
            exit 1
          fi

          # 按语义版本排序，取最高的一行
          best_line=$(sort -t'|' -k1,1V "$tmp" | tail -1)
          best_ver="${best_line%%|*}"
          best_app="${best_line#*|}"
          major="${best_ver%%.*}"

          v27_line=$(sort -t'|' -k1,1V "$tmp" | awk -F'|' '$1+0 >= 27' | tail -1 || true)
          if [ -n "$v27_line" ]; then
            best_ver="${v27_line%%|*}"
            best_app="${v27_line#*|}"
            major="${best_ver%%.*}"
            echo "::notice::找到 iOS 27 SDK：${best_ver}"
          else
            echo "::warning::runner 上没有 iOS 27 SDK（最高 ${best_ver}），将临时下调部署目标以便产出 IPA"
          fi

          echo "选中 ${best_app}（iOS SDK ${best_ver}）"
          {
            echo "DEVELOPER_DIR=${best_app}/Contents/Developer"
            echo "PICKED_XCODE=${best_app}"
            echo "SDK_VERSION=${best_ver}"
            echo "SDK_MAJOR=${major}"
          } >> "$GITHUB_ENV"
          echo "sdk_major=${major}" >> "$GITHUB_OUTPUT"
          echo "sdk_version=${best_ver}" >> "$GITHUB_OUTPUT"
          rm -f "$tmp"

      - name: Verify toolchain
        run: |
          xcodebuild -version
          xcodebuild -showsdks
          swift --version

      - name: Install XcodeGen
        run: |
          if command -v xcodegen >/dev/null 2>&1; then
            xcodegen --version
          else
            brew install xcodegen
          fi

      - name: Generate Xcode project
        run: |
          set -euo pipefail
          xcodegen generate --spec project.yml
          ls -la Pogent.xcodeproj
          xcodebuild -project Pogent.xcodeproj -list

      - name: Build (no code signing)
        id: build
        run: |
          set -o pipefail
          OVERRIDE=""
          if [ "${SDK_MAJOR:-0}" -lt 27 ]; then
            OVERRIDE="IPHONEOS_DEPLOYMENT_TARGET=${SDK_MAJOR}.0"
            echo "::warning::降级构建：${OVERRIDE}（产物不是 iOS 27 包）"
          fi
          set -x
          xcodebuild \
            -project Pogent.xcodeproj \
            -scheme Pogent \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_STYLE=Manual \
            PROVISIONING_PROFILE_SPECIFIER="" \
            DEVELOPMENT_TEAM="" \
            ENABLE_BITCODE=NO \
            DEBUG_INFORMATION_FORMAT=dwarf \
            $OVERRIDE \
            build 2>&1 | tee build.log | tail -n 300

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -1)
          if [ -z "$APP" ]; then echo "::error::没找到 .app 产物"; exit 1; fi
          echo "APP=$APP"
          rm -rf Payload Pogent-unsigned.ipa
          mkdir -p Payload
          cp -R "$APP" Payload/
          rm -rf Payload/*.app/_CodeSignature Payload/*.app/embedded.mobileprovision || true
          zip -qry Pogent-unsigned.ipa Payload
          ls -lh Pogent-unsigned.ipa
          unzip -l Pogent-unsigned.ipa | head -20
          {
            echo "### 未签名 IPA 已生成"
            echo ""
            echo "| 项 | 值 |"
            echo "|---|---|"
            echo "| 文件 | Pogent-unsigned.ipa |"
            echo "| 大小 | $(du -h Pogent-unsigned.ipa | cut -f1) |"
            echo "| Xcode | $(xcodebuild -version | tr '\n' ' ') |"
            echo "| iOS SDK | ${SDK_VERSION} |"
            echo "| 最低系统 | $(plutil -extract MinimumOSVersion raw "Payload/$(basename "$APP")/Info.plist" 2>/dev/null || echo unknown) |"
            echo "| 签名 | 无 |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: pogent-unsigned-ipa
          path: Pogent-unsigned.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            build.log
            build/Logs/Build/*.xcactivitylog
          if-no-files-found: warn
          retention-days: 7

  release:
    name: Attach IPA to release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: pogent-unsigned-ipa

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: Pogent-unsigned.ipa
          generate_release_notes: true
